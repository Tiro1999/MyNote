name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: 'application/dist/*.exe'
          - os: macos-latest
            artifact_glob: 'application/dist/*.dmg'
          - os: ubuntu-latest
            artifact_glob: 'application/dist/*.AppImage'

    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - uses: ./.github/actions/pin-npm

      - name: Install dependencies
        run: npm ci

      # Record exact Node / npm / V8 versions used for this release build
      - name: Record runtime versions
        shell: bash
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "v8=$(node -e 'process.stdout.write(process.versions.v8)')"
            echo "tag=${{ github.ref_name }}"
            echo "os=${{ matrix.os }}"
          } > "runtime-versions-${{ matrix.os }}.txt"
          cat "runtime-versions-${{ matrix.os }}.txt"

      # Stamp the exact semver from the tag into package.json before building
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build & package
        run: npm run dist

      # Installer plus updater metadata (latest*.yml, *.blockmap); see documentation/software/build/build-and-release.md
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            application/dist/*.blockmap
            application/dist/latest*.yml
          if-no-files-found: error
          # Hand-off only: the release job deletes it, this is the backstop; see documentation/software/build/build-and-release.md
          retention-days: 1

      - name: Upload runtime versions
        uses: actions/upload-artifact@v7
        with:
          name: runtime-versions-${{ matrix.os }}
          path: application/runtime-versions-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 1

  # One mandatory SBOM per release, built from the lockfile; see documentation/software/build/sbom.md
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - uses: ./.github/actions/pin-npm

      # Stamp the tag version so the SBOM's root component matches the release
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # --package-lock-only reads the lockfile, so no npm ci is needed; see documentation/software/build/sbom.md
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --package-lock-only > "sbom-${{ github.ref_name }}.cdx.json"

      - name: Validate SBOM is well-formed
        run: |
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "sbom-${{ github.ref_name }}.cdx.json" > /dev/null
          echo "SBOM contains $(jq '.components | length' "sbom-${{ github.ref_name }}.cdx.json") components"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: application/sbom-${{ github.ref_name }}.cdx.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # delete the hand-off artifacts once the release holds them

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          name: MyNote ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/installer-*/**
            artifacts/sbom/**
            artifacts/runtime-versions-*/**

      # Frees the Actions quota; not `if: always()`, a failed release keeps the only copy; see documentation/software/build/build-and-release.md
      - name: Delete hand-off artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | "\(.id) \(.name)"' \
          | while read -r ID NAME; do
              if gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID"; then
                echo "Deleted artifact $NAME (#$ID)"
              fi
            done
