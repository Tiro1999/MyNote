name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'application/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'application/**'

jobs:
  quality:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Record runtime versions
        run: |
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "v8=$(node -e 'process.stdout.write(process.versions.v8)')"
          } > runtime-versions.txt
          cat runtime-versions.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            application/out/
            application/runtime-versions.txt
          retention-days: 7
