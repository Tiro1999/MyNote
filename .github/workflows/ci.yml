name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'application/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'application/**'

jobs:
  quality:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same command as the Release workflow's mandatory SBOM job — fail here
      # instead of on the tag. Typical cause: an optional platform package with
      # bundleDependencies (e.g. @tailwindcss/oxide-wasm32-wasi) whose bundled
      # deps are missing from the lockfile; see documentation/software/build/sbom.md.
      - name: Check SBOM generation
        run: npm sbom --sbom-format cyclonedx --package-lock-only > /dev/null

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # CI is a pure quality gate: it proves the code lints, type-checks and
      # builds. It intentionally produces no downloadable artifact — installable
      # binaries come only from the Release workflow (on a version tag).
      - name: Record runtime versions (log only)
        run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "v8=$(node -e 'process.stdout.write(process.versions.v8)')"
