name: CI

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/pin-npm/**'
      - '.nvmrc'
  pull_request:
    branches: [main]
    paths:
      - 'application/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/pin-npm/**'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  quality:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - uses: ./.github/actions/pin-npm

      - name: Install dependencies
        run: npm ci

      # Same command as the mandatory release SBOM job, so it fails here and not on the tag; see documentation/software/build/sbom.md
      - name: Check SBOM generation
        run: npm sbom --sbom-format cyclonedx --package-lock-only > /dev/null

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Quality gate only, no artifacts: installers come from release.yml; see documentation/software/build/build-and-release.md
      - name: Record runtime versions (log only)
        run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "v8=$(node -e 'process.stdout.write(process.versions.v8)')"
