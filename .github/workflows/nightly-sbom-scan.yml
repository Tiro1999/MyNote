name: Nightly SBOM Scan

# Scans the SBOM of the latest release tag (by semver, regardless of the
# GitHub Release's draft status — releases here are never published, only
# tagged and built) for known vulnerabilities every night, cross-checking
# three independent data sources (Grype, OSV.dev via osv-scanner, Trivy) plus
# npm audit against the GitHub Advisory Database. Findings are written to the
# job summary and reported in a GitHub issue; the run fails when — and only
# when — vulnerabilities are found, so the signal in the Actions overview means
# exactly one thing. Archiving the reports is best effort: a full Actions
# storage quota must never turn a clean scan red.

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # delete superseded scan artifacts (see "Purge" step)

jobs:
  scan:
    name: Scan latest release SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — needed to list release tags

      - name: Resolve latest release tag
        id: tag
        run: |
          TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::notice::No release tag found yet — nothing to scan."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Latest release tag: $TAG"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            git checkout "refs/tags/$TAG"
          fi

      - uses: actions/setup-node@v5
        if: steps.tag.outputs.found == 'true'
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      # Prefer the SBOM asset attached to the (published) release; fall back to
      # regenerating it from the tag's package-lock.json — npm sbom is
      # deterministic from the lockfile, so the result describes the same
      # dependency set (e.g. while the release is still a draft).
      - name: Obtain SBOM for ${{ steps.tag.outputs.tag }}
        if: steps.tag.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release download "$TAG" --pattern 'sbom-*.cdx.json' --output sbom.cdx.json 2>/dev/null; then
            echo "Downloaded SBOM asset from release $TAG"
          else
            echo "::notice::No SBOM asset downloadable for $TAG (release is a draft by design) — regenerating from package-lock.json"
            cd application
            npm version "${TAG#v}" --no-git-tag-version --allow-same-version
            npm sbom --sbom-format cyclonedx --package-lock-only > ../sbom.cdx.json
            cd ..
          fi
          jq -e '.bomFormat == "CycloneDX"' sbom.cdx.json > /dev/null

      - name: Install Grype
        if: steps.tag.outputs.found == 'true'
        run: |
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/grype" version

      - name: Install OSV-Scanner
        if: steps.tag.outputs.found == 'true'
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/google/osv-scanner/releases/latest | jq -r .tag_name)
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${VERSION}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          "$HOME/.local/bin/osv-scanner" --version

      - name: Install Trivy
        if: steps.tag.outputs.found == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/trivy" version

      # Each tool draws from a different upstream vulnerability feed (Grype:
      # NVD + vendor feeds, OSV-Scanner: OSV.dev/GHSA, Trivy: NVD + Red Hat +
      # Debian + GHSA, npm audit: GitHub Advisory Database), so running all
      # four catches advisories that any single source might be missing.

      - name: Scan SBOM with Grype
        id: grype
        if: steps.tag.outputs.found == 'true'
        run: |
          GRYPE="$HOME/.local/bin/grype"
          "$GRYPE" sbom:sbom.cdx.json -o table | tee grype-report.txt
          "$GRYPE" sbom:sbom.cdx.json -o json > grype-report.json
          COUNT=$(jq '.matches | length' grype-report.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan SBOM with OSV-Scanner
        id: osv
        if: steps.tag.outputs.found == 'true'
        run: |
          OSV="$HOME/.local/bin/osv-scanner"
          "$OSV" --sbom=sbom.cdx.json --format table 2>&1 | tee osv-report.txt || true
          "$OSV" --sbom=sbom.cdx.json --format json --output osv-report.json || true
          COUNT=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-report.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan SBOM with Trivy
        id: trivy
        if: steps.tag.outputs.found == 'true'
        run: |
          TRIVY="$HOME/.local/bin/trivy"
          "$TRIVY" sbom sbom.cdx.json --format table --exit-code 0 | tee trivy-report.txt
          "$TRIVY" sbom sbom.cdx.json --format json --exit-code 0 --output trivy-report.json
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan package-lock.json with npm audit
        id: npm-audit
        if: steps.tag.outputs.found == 'true'
        run: |
          cd application
          npm audit --package-lock-only | tee ../npm-audit-report.txt || true
          npm audit --package-lock-only --json > ../npm-audit-report.json || true
          cd ..
          COUNT=$(jq '.metadata.vulnerabilities.total' npm-audit-report.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Combine results
        id: scan
        if: steps.tag.outputs.found == 'true'
        env:
          GRYPE_COUNT: ${{ steps.grype.outputs.count }}
          OSV_COUNT: ${{ steps.osv.outputs.count }}
          TRIVY_COUNT: ${{ steps.trivy.outputs.count }}
          NPM_AUDIT_COUNT: ${{ steps.npm-audit.outputs.count }}
        run: |
          TOTAL=$((GRYPE_COUNT + OSV_COUNT + TRIVY_COUNT + NPM_AUDIT_COUNT))
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"

          {
            echo "## Nightly SBOM scan — ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "| Scanner | Data source | Findings |"
            echo "|---------|-------------|----------|"
            echo "| [Grype](https://github.com/anchore/grype) | NVD + vendor feeds | $GRYPE_COUNT |"
            echo "| [OSV-Scanner](https://github.com/google/osv-scanner) | OSV.dev / GHSA | $OSV_COUNT |"
            echo "| [Trivy](https://github.com/aquasecurity/trivy) | NVD + Red Hat + Debian + GHSA | $TRIVY_COUNT |"
            echo "| npm audit | GitHub Advisory Database | $NPM_AUDIT_COUNT |"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ No known vulnerabilities found by any scanner."
            else
              echo "⚠️ **$TOTAL vulnerability finding(s) across all scanners**"
              echo ""
              echo "<details><summary>Grype report</summary>"
              echo ""
              echo '```'
              cat grype-report.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>OSV-Scanner report</summary>"
              echo ""
              echo '```'
              cat osv-report.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>Trivy report</summary>"
              echo ""
              echo '```'
              cat trivy-report.txt
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>npm audit report</summary>"
              echo ""
              echo '```'
              cat npm-audit-report.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifacts are immutable — a later run uploading the same name adds
      # another copy instead of replacing the old one, so nightly reports pile
      # up until they expire. Only the newest scan is ever of interest, so drop
      # the earlier copies first: this workflow then costs one run's worth of
      # reports rather than one per night.
      - name: Purge superseded scan artifacts
        if: steps.tag.outputs.found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
                  | select(.expired == false and (.name | startswith("sbom-scan-reports-")))
                  | "\(.id) \(.name)"' \
          | while read -r ID NAME; do
              if gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID"; then
                echo "Deleted superseded artifact $NAME (#$ID)"
              fi
            done

      # Archived only when there is something to read: on a clean night every
      # report is a list of zeros already stated in the summary, and the SBOM is
      # reproducible from the tag's lockfile at any time. Skipping the upload
      # keeps the quiet nights — nearly all of them — at zero bytes.
      #
      # Best effort even then: the reports are a convenience, the scanner counts
      # are the result. A failed upload — an exhausted storage quota being the
      # usual cause — is recorded in the summary and left at that.
      - name: Upload scan reports
        id: upload
        if: steps.tag.outputs.found == 'true' && steps.scan.outputs.count != '0'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sbom-scan-reports-${{ steps.tag.outputs.tag }}
          path: |
            grype-report.txt
            grype-report.json
            osv-report.txt
            osv-report.json
            trivy-report.txt
            trivy-report.json
            npm-audit-report.txt
            npm-audit-report.json
            sbom.cdx.json
          retention-days: 14

      - name: Note unarchived reports
        if: steps.tag.outputs.found == 'true' && steps.upload.outcome == 'failure'
        run: |
          echo "::notice::Scan reports could not be archived (Actions storage quota) — the scan result itself is unaffected."
          {
            echo ""
            echo "> ℹ️ The scan reports could not be uploaded (Actions storage quota)."
            echo "> The scan itself completed normally; the table above is the full result."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report findings as GitHub issue
        if: steps.tag.outputs.found == 'true' && steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TOTAL: ${{ steps.scan.outputs.count }}
          GRYPE_COUNT: ${{ steps.grype.outputs.count }}
          OSV_COUNT: ${{ steps.osv.outputs.count }}
          TRIVY_COUNT: ${{ steps.trivy.outputs.count }}
          NPM_AUDIT_COUNT: ${{ steps.npm-audit.outputs.count }}
        run: |
          TITLE="Nightly SBOM scan: vulnerabilities in $TAG"

          {
            echo "The nightly SBOM scan of the \`$TAG\` release found **$TOTAL vulnerability finding(s)** across four independent scanners."
            echo ""
            echo "| Scanner | Data source | Findings |"
            echo "|---------|-------------|----------|"
            echo "| [Grype](https://github.com/anchore/grype) | NVD + vendor feeds | $GRYPE_COUNT |"
            echo "| [OSV-Scanner](https://github.com/google/osv-scanner) | OSV.dev / GHSA | $OSV_COUNT |"
            echo "| [Trivy](https://github.com/aquasecurity/trivy) | NVD + Red Hat + Debian + GHSA | $TRIVY_COUNT |"
            echo "| npm audit | GitHub Advisory Database | $NPM_AUDIT_COUNT |"
            echo ""

            if [ "$GRYPE_COUNT" != "0" ]; then
              echo "### Grype"
              echo ""
              echo "| Package | Version | Vulnerability | Severity | Fixed in |"
              echo "|---------|---------|---------------|----------|----------|"
              jq -r '.matches[] | "| \(.artifact.name) | \(.artifact.version) | \(.vulnerability.id) | \(.vulnerability.severity) | \(if (.vulnerability.fix.versions | length) > 0 then (.vulnerability.fix.versions | join(", ")) else "—" end) |"' grype-report.json
              echo ""
            fi

            if [ "$OSV_COUNT" != "0" ]; then
              echo "### OSV-Scanner"
              echo ""
              echo "| Package | Version | Vulnerability |"
              echo "|---------|---------|----------------|"
              jq -r '.results[]?.packages[]? | .package as $p | .vulnerabilities[]? | "| \($p.name) | \($p.version) | \(.id) |"' osv-report.json
              echo ""
            fi

            if [ "$TRIVY_COUNT" != "0" ]; then
              echo "### Trivy"
              echo ""
              echo "| Package | Version | Vulnerability | Severity | Fixed in |"
              echo "|---------|---------|---------------|----------|----------|"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.PkgName) | \(.InstalledVersion) | \(.VulnerabilityID) | \(.Severity) | \(.FixedVersion // "—") |"' trivy-report.json
              echo ""
            fi

            if [ "$NPM_AUDIT_COUNT" != "0" ]; then
              echo "### npm audit"
              echo ""
              echo "| Package | Severity | Vulnerability |"
              echo "|---------|----------|----------------|"
              jq -r '.vulnerabilities // {} | to_entries[] | .value as $v | ($v.via // []) | map(select(type == "object")) | .[] | "| \($v.name) | \($v.severity) | \(.title // .name) |"' npm-audit-report.json | sort -u
              echo ""
            fi

            echo "_Last scan: $(date -u '+%Y-%m-%d %H:%M UTC') — full reports in the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > issue-body.md

          gh label create sbom-scan --description "Automated nightly SBOM vulnerability scan" --color D93F0B --force || true

          EXISTING=$(gh issue list --state open --label sbom-scan --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file issue-body.md
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label sbom-scan --body-file issue-body.md
          fi

      - name: Fail run when vulnerabilities were found
        if: steps.tag.outputs.found == 'true' && steps.scan.outputs.count != '0'
        run: |
          echo "::error::${{ steps.scan.outputs.count }} vulnerability finding(s) in the ${{ steps.tag.outputs.tag }} SBOM (Grype/OSV-Scanner/Trivy/npm audit) — see the job summary and the 'sbom-scan' issue."
          exit 1
